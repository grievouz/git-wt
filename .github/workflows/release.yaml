name: Release

on:
  release:
    types: [published]

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  upload-assets:
    name: ${{ matrix.target }}
    if: github.repository_owner == 'grievouz'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-freebsd
            os: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
        if: contains(matrix.target, '-musl')
      - run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
        if: endsWith(matrix.target, 'windows-msvc')
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: git-wt
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: upload-assets
    if: github.repository_owner == 'grievouz'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: grievouz/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true

      - name: Bump formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${VERSION_TAG#v}"
          TMP=$(mktemp -d)

          gh release download "$VERSION_TAG" -R grievouz/git-wt \
            -p 'git-wt-aarch64-apple-darwin.tar.gz' \
            -p 'git-wt-x86_64-apple-darwin.tar.gz' \
            -p 'git-wt-aarch64-unknown-linux-gnu.tar.gz' \
            -p 'git-wt-x86_64-unknown-linux-gnu.tar.gz' \
            -D "$TMP"

          FORMULA=Formula/git-wt.rb

          sed -i -E "s|^( *version )\"[^\"]+\"|\\1\"$V\"|" "$FORMULA"

          update_sha() {
            local asset=$1
            local sha
            sha=$(sha256sum "$TMP/$asset" | cut -d' ' -f1)
            # Find the url line for $asset, then replace sha256 on the next line
            sed -i -E "\|$asset\"\$|{n;s|sha256 \"[a-f0-9]+\"|sha256 \"$sha\"|;}" "$FORMULA"
          }

          update_sha git-wt-aarch64-apple-darwin.tar.gz
          update_sha git-wt-x86_64-apple-darwin.tar.gz
          update_sha git-wt-aarch64-unknown-linux-gnu.tar.gz
          update_sha git-wt-x86_64-unknown-linux-gnu.tar.gz

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA"
          git commit -m "git-wt $V"
          git push